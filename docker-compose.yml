services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_SUPABASE_STORAGE_BUCKET: ${VITE_SUPABASE_STORAGE_BUCKET:-application-documents}
        VITE_ORG_ADDRESS: ${VITE_ORG_ADDRESS:-}
        VITE_ORG_PHONE: ${VITE_ORG_PHONE:-}
        VITE_ORG_EMAIL: ${VITE_ORG_EMAIL:-}
    container_name: zimregistry_frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
